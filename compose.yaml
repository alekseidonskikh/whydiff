# Databases for local development and tests.
#
#   make up                                   # Postgres
#   docker compose --profile clickhouse up -d # + ClickHouse (for v0.2)
#
# Python runs on the host through uv; only the databases live here.

name: whydiff

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: whydiff
      POSTGRES_PASSWORD: whydiff
      POSTGRES_DB: whydiff
    ports:
      - "${WHYDIFF_PG_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # runs once, on the first start with an empty volume
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whydiff -d whydiff"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["clickhouse"]
    environment:
      CLICKHOUSE_USER: whydiff
      CLICKHOUSE_PASSWORD: whydiff
      CLICKHOUSE_DB: whydiff
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${WHYDIFF_CH_HTTP_PORT:-18123}:8123"
      - "${WHYDIFF_CH_NATIVE_PORT:-19000}:9000"
    volumes:
      - ch-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user whydiff --password whydiff -q 'select 1'"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  pg-data:
  ch-data:
